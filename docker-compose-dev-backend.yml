version: "3.3"
# Env file for all services and for ${DB_*} substitution: ./backend/services/.env
# (Compose also reads repo-root .env for interpolation — keep it in sync or hard-link to this file.)
volumes:
  data:
    driver: local
  filestore:
    driver: local
  pgadmin_data:
    driver: local

services:
  dbmrv:
    container_name: dbmrv
    image: postgres
    restart: always
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      PGPORT: ${DB_PORT}
      PSQL_USERNAME: ${DB_USER}
      PGDATA: /data/postgres
    volumes:
      - ./init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql.template:ro
      - data:/data/postgres
    env_file:
      - ./backend/services/.env

  # pgadmin:
  #   container_name: pgadmin4
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PWD}
  #   ports:
  #     - 5050:80
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin  
  #   env_file:
  #     - ./backend/services/.env

  migration:
    build:
      context: .
      dockerfile: ./backend/services/Dockerfile
    depends_on:
      - dbmrv
      - national
    command: ['yarn', 'migration:run']
    environment:
      DB_HOST: dbmrv
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    env_file:
      - ./backend/services/.env

  national:
    build:
      context: .
      dockerfile: ./backend/services/Dockerfile
    ports:
      - "9000:3000"
    depends_on:
      - dbmrv
    environment:
      DB_HOST: dbmrv
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RUN_MODULE: national-api
      rootEmail: <ROOT EMAIL>
      systemCountryCode: "NG"
      name: "Antactic Region"
      IS_EMAIL_DISABLED: ${IS_EMAIL_DISABLED:-true}
      ASYNC_OPERATIONS_TYPE: Database
      HOST: "http://localhost:3030"
      DOMAIN_MAP: "true"
      EXPIRES_IN: "7200"
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      NODE_ENV: 'dev'
      FILE_SERVICE: local
      S3_COMMON_BUCKET: "<Set when FILE_SERVICE is S3 instead of LOCAL>"
      DISABLE_LOW_PRIORITY_EMAIL: ${DISABLE_LOW_PRIORITY_EMAIL:-true}
      SYSTEM_TYPE: CARBON_TRANSPARENCY_SYSTEM  
      BACKEND_HOST: http://localhost:9000
      SYSTEM_NAME: National Climate Transparency System
    volumes:
      - filestore:/app/backend/services/public
      - ./users.csv:/app/backend/services/users.csv
      - ./organisations.csv:/app/backend/services/organisations.csv
    env_file:
      - ./backend/services/.env

  stats:
    build:
      context: .
      dockerfile: ./backend/services/Dockerfile
    ports:
      - "9100:3100"
    depends_on:
      - dbmrv
      - national
    environment:
      DB_HOST: dbmrv
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RUN_PORT: 3100
      RUN_MODULE: analytics-api
      DOMAIN_MAP: "true"
      DB_PORT:  ${DB_PORT}
      DB_NAME: ${DB_NAME}
      NODE_ENV: 'dev'
      FILE_SERVICE: local
      S3_COMMON_BUCKET: "<Set when FILE_SERVICE is S3 instead of LOCAL>"
    env_file:
      - ./backend/services/.env

